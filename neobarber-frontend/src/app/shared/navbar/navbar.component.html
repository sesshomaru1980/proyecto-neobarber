<nav class="navbar">

  <div class="nav-left">

    <img
      src="assets/logo-neobarber.png"
      alt="NeoBarber"
      class="nav-logo"
    />

    <!-- ===================== -->
    <!-- ADMIN -->
    <!-- ===================== -->

    <ng-container
      *ngIf="
        auth.role() === 'Admin'
      "
    >

      <a routerLink="/admin">
        Dashboard
      </a>

      <a routerLink="/services">
        Servicios
      </a>

      <a routerLink="/barbers">
        Barberos
      </a>

      <a routerLink="/barber-panel/agenda">
        Agenda
      </a>

    </ng-container>

    <!-- ===================== -->
    <!-- BARBERO -->
    <!-- ===================== -->

    <ng-container
      *ngIf="
        auth.role() === 'Barber'
      "
    >

      <a
        routerLink="/barber-panel/agenda"
      >
        Mi Agenda
      </a>

    </ng-container>

    <!-- ===================== -->
    <!-- CLIENTE -->
    <!-- ===================== -->

    <ng-container
      *ngIf="
        auth.role() === 'Client'
      "
    >

      <a routerLink="/services">
        Servicios
      </a>

      <a routerLink="/barbers">
        Barberos
      </a>

      <a routerLink="/appointments">
        Mis citas
      </a>

      <a
        routerLink="/appointments/create"
      >
        Agendar
      </a>

    </ng-container>

  </div>

  <div
  class="nav-right"
  *ngIf="
    auth.user$ | async as u
  "
>

  <details class="user-dropdown">

    <summary>

      <div class="avatar">

        {{
          u.fullName
          ? u.fullName.charAt(0)
          : u.email.charAt(0)
        }}

      </div>

      <div class="user-info">

        <span class="user-name">

          {{
            u.fullName ||
            u.email
          }}

        </span>

        <small>

          {{ u.role }}

        </small>

      </div>

    </summary>

    <div class="dropdown-menu">

      <div class="dropdown-header">

        <strong>

          {{
            u.fullName ||
            u.email
          }}

        </strong>

        <small>

          {{ u.email }}

        </small>

      </div>

      <button
        class="dropdown-item"
      >
        👤 Mi perfil
      </button>

      <button
        class="dropdown-item"
      >
        🔒 Cambiar contraseña
      </button>

      <button
        class="dropdown-item logout-item"
        (click)="logout()"
      >
        🚪 Cerrar sesión
      </button>

    </div>

  </details>

</div>
</nav>
